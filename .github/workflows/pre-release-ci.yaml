# Safety net for tags pushed by hand. The Release workflow tags only after the
# acceptance tests pass, and the tags it pushes use GITHUB_TOKEN, which does
# not trigger this workflow. So a run here means someone tagged outside the
# release pipeline.
name: pre-release-ci
on:
  push:
    tags:
      - 'v*'
jobs:
  acceptance-test:
    uses: ./.github/workflows/acceptance-tests.yml
    secrets: inherit
