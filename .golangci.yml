version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # The Id/Url/Sql spellings mirror the Cloud API SDK's own field names.
        - -ST1003
  exclusions:
    # v1 applied these by default; v2 makes them opt-in. Dropping them would
    # newly fail on unchecked Close and os.Setenv calls.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
